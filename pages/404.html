<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Off-Budget | Personal Finance Management</title>

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/webp"
      href="../assets/images/logoStackly.webp"
    />

    <!-- Bootstrap 5.3 CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Font Awesome 6 CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Open+Sans:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Shared Stylesheets -->
    <link rel="stylesheet" href="../assets/css/styles.css" />

    <style>
      /* ── Page background ── */
      .error-section {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(
          135deg,
          #f0fdf8 0%,
          #f8fafc 50%,
          #f0f4ff 100%
        );
        position: relative;
        overflow: hidden;
      }

      /* ── Animated background orbs ── */
      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.45;
        animation: driftOrb 12s ease-in-out infinite;
        pointer-events: none;
      }
      .orb-1 {
        width: 420px;
        height: 420px;
        background: radial-gradient(
          circle,
          rgba(16, 185, 129, 0.35),
          transparent 70%
        );
        top: -120px;
        left: -100px;
        animation-delay: 0s;
      }
      .orb-2 {
        width: 320px;
        height: 320px;
        background: radial-gradient(
          circle,
          rgba(245, 158, 11, 0.25),
          transparent 70%
        );
        bottom: -80px;
        right: -80px;
        animation-delay: -4s;
      }
      .orb-3 {
        width: 200px;
        height: 200px;
        background: radial-gradient(
          circle,
          rgba(99, 102, 241, 0.2),
          transparent 70%
        );
        top: 40%;
        left: 60%;
        animation-delay: -8s;
      }
      @keyframes driftOrb {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        33% {
          transform: translate(30px, -20px) scale(1.05);
        }
        66% {
          transform: translate(-20px, 25px) scale(0.97);
        }
      }

      /* ── Floating dots grid ── */
      .dot-grid {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(
          circle,
          rgba(16, 185, 129, 0.12) 1px,
          transparent 1px
        );
        background-size: 32px 32px;
        pointer-events: none;
      }

      /* ── Card ── */
      .error-card {
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border-radius: 28px;
        box-shadow:
          0 4px 6px rgba(16, 185, 129, 0.04),
          0 20px 60px rgba(30, 41, 59, 0.1),
          0 0 0 1px rgba(16, 185, 129, 0.1);
        padding: 30px 48px 48px;
        position: relative;
        overflow: hidden;
        transition: box-shadow 0.4s ease;
      }
      .error-card:hover {
        box-shadow:
          0 4px 6px rgba(16, 185, 129, 0.06),
          0 30px 80px rgba(30, 41, 59, 0.13),
          0 0 0 1.5px rgba(16, 185, 129, 0.22);
      }

      /* Top accent bar */
      .error-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 5px;
        background: linear-gradient(90deg, #10b981, #059669, #f59e0b);
        background-size: 200% 100%;
        animation: shimmerBar 3s linear infinite;
      }
      @keyframes shimmerBar {
        0% {
          background-position: 0% 0%;
        }
        100% {
          background-position: 200% 0%;
        }
      }

      /* Corner decoration */
      .error-card::after {
        content: "";
        position: absolute;
        bottom: -60px;
        right: -60px;
        width: 180px;
        height: 180px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(16, 185, 129, 0.07),
          transparent 70%
        );
        pointer-events: none;
      }

      /* ── SVG illustration ── */
      .error-svg-wrap {
        animation: floatUp 6s ease-in-out infinite;
        margin-bottom: 8px;
      }
      @keyframes floatUp {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-12px);
        }
      }

      /* ── 404 number ── */
      .error-title {
        font-family: var(--font-heading);
        font-weight: 900;
        font-size: clamp(5rem, 14vw, 8rem);
        line-height: 1;
        letter-spacing: -4px;
        background: linear-gradient(
          135deg,
          #1e293b 0%,
          #10b981 50%,
          #059669 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        position: relative;
        display: inline-block;
        margin-bottom: 4px;
        animation: titlePulse 4s ease-in-out infinite;
      }
      @keyframes titlePulse {
        0%,
        100% {
          filter: drop-shadow(0 0 0px rgba(16, 185, 129, 0));
        }
        50% {
          filter: drop-shadow(0 0 18px rgba(16, 185, 129, 0.35));
        }
      }

      /* ── Subtitle & description ── */
      .error-subtitle {
        font-family: var(--font-heading);
        font-size: 1.45rem;
        font-weight: 700;
        color: var(--secondary-slate);
        margin-bottom: 14px;
      }
      .error-subtitle span {
        color: var(--primary-emerald);
      }
      .error-desc {
        color: var(--text-muted);
        font-size: 1rem;
        max-width: 460px;
        margin: 0 auto 36px;
        line-height: 1.7;
      }

      /* ── Buttons ── */
      .error-buttons .btn {
        padding: 13px 32px;
        font-size: 0.95rem;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: all 0.3s ease;
      }

      /* ── Quick-links row ── */
      .quick-links {
        margin-top: 36px;
        padding-top: 28px;
        border-top: 1px solid rgba(226, 232, 240, 0.8);
      }
      .quick-links p {
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #94a3b8;
        margin-bottom: 14px;
      }
      .quick-link-item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 16px;
        border-radius: 50px;
        border: 1px solid rgba(226, 232, 240, 0.9);
        background: #ffffff;
        color: var(--secondary-slate);
        font-size: 0.82rem;
        font-weight: 600;
        font-family: var(--font-heading);
        text-decoration: none;
        transition: all 0.25s ease;
        box-shadow: 0 2px 6px rgba(30, 41, 59, 0.04);
      }
      .quick-link-item:hover {
        border-color: var(--primary-emerald);
        color: var(--primary-emerald);
        background: rgba(16, 185, 129, 0.04);
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.12);
      }
      .quick-link-item i {
        font-size: 0.75rem;
        opacity: 0.7;
      }

      /* ── Staggered entrance animations ── */
      .anim-up {
        opacity: 0;
        transform: translateY(24px);
        animation: slideUp 0.6s ease forwards;
      }
      .anim-up:nth-child(1) {
        animation-delay: 0.1s;
      }
      .anim-up:nth-child(2) {
        animation-delay: 0.22s;
      }
      .anim-up:nth-child(3) {
        animation-delay: 0.34s;
      }
      .anim-up:nth-child(4) {
        animation-delay: 0.46s;
      }
      .anim-up:nth-child(5) {
        animation-delay: 0.58s;
      }
      .anim-up:nth-child(6) {
        animation-delay: 0.7s;
      }
      @keyframes slideUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ── Status badge ── */
      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(239, 68, 68, 0.08);
        border: 1px solid rgba(239, 68, 68, 0.2);
        color: #ef4444;
        font-size: 0.72rem;
        font-weight: 700;
        font-family: var(--font-heading);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 5px 14px;
        border-radius: 50px;
        margin-bottom: 18px;
      }
      .status-badge .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #ef4444;
        animation: blink 1.4s ease-in-out infinite;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.2;
        }
      }
    </style>
  </head>
  <body>
    <section class="error-section">
      <!-- Background layers -->
      <div class="dot-grid"></div>
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>

      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-6 col-md-9 text-center">
            <div class="error-card">
              <!-- SVG Illustration -->
              <div class="error-svg-wrap anim-up">
                <svg
                  viewBox="0 0 400 240"
                  width="100%"
                  height="200"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <defs>
                    <linearGradient id="eg" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stop-color="#10b981" />
                      <stop offset="100%" stop-color="#059669" />
                    </linearGradient>
                    <linearGradient id="gg" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stop-color="#f59e0b" />
                      <stop offset="100%" stop-color="#d97706" />
                    </linearGradient>
                    <linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stop-color="#475569" />
                      <stop offset="100%" stop-color="#1e293b" />
                    </linearGradient>
                    <linearGradient
                      id="redG"
                      x1="0%"
                      y1="0%"
                      x2="100%"
                      y2="100%"
                    >
                      <stop offset="0%" stop-color="#f87171" />
                      <stop offset="100%" stop-color="#ef4444" />
                    </linearGradient>
                    <filter id="glow">
                      <feGaussianBlur stdDeviation="3" result="blur" />
                      <feMerge>
                        <feMergeNode in="blur" />
                        <feMergeNode in="SourceGraphic" />
                      </feMerge>
                    </filter>
                    <filter id="sh">
                      <feDropShadow
                        dx="0"
                        dy="4"
                        stdDeviation="3"
                        flood-color="#1e293b"
                        flood-opacity="0.1"
                      />
                    </filter>
                  </defs>

                  <!-- Grid -->
                  <g
                    stroke="#e2e8f0"
                    stroke-width="1"
                    stroke-dasharray="4 4"
                    opacity="0.7"
                  >
                    <line x1="40" y1="40" x2="360" y2="40" />
                    <line x1="40" y1="90" x2="360" y2="90" />
                    <line x1="40" y1="140" x2="360" y2="140" />
                    <line x1="40" y1="190" x2="360" y2="190" />
                    <line x1="40" y1="40" x2="40" y2="190" />
                    <line x1="120" y1="40" x2="120" y2="190" />
                    <line x1="200" y1="40" x2="200" y2="190" />
                    <line x1="280" y1="40" x2="280" y2="190" />
                    <line x1="360" y1="40" x2="360" y2="190" />
                  </g>

                  <!-- Area fill under green line -->
                  <path
                    d="M 40 190 L 40 175 L 120 125 L 200 145 L 248 100 L 248 190 Z"
                    fill="url(#eg)"
                    opacity="0.08"
                  />

                  <!-- Ghost line -->
                  <path
                    d="M 40 175 L 120 125 L 200 145 L 280 75 L 320 110 L 360 200"
                    fill="none"
                    stroke="#cbd5e1"
                    stroke-width="2.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />

                  <!-- Green healthy line -->
                  <path
                    d="M 40 175 L 120 125 L 200 145 L 248 100"
                    fill="none"
                    stroke="url(#eg)"
                    stroke-width="4.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    filter="url(#glow)"
                  />

                  <!-- Red broken line -->
                  <path
                    d="M 248 100 L 280 138 L 315 178"
                    fill="none"
                    stroke="url(#redG)"
                    stroke-width="4.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-dasharray="6 5"
                  />

                  <!-- Data points -->
                  <circle cx="40" cy="175" r="4" fill="#10b981" />
                  <circle cx="120" cy="125" r="4" fill="#10b981" />
                  <circle cx="200" cy="145" r="4" fill="#10b981" />
                  <circle
                    cx="248"
                    cy="100"
                    r="7"
                    fill="#ffffff"
                    stroke="#10b981"
                    stroke-width="3"
                    filter="url(#sh)"
                  />
                  <circle
                    cx="315"
                    cy="178"
                    r="7"
                    fill="#ffffff"
                    stroke="#ef4444"
                    stroke-width="3"
                    filter="url(#sh)"
                  />

                  <!-- Magnifying glass -->
                  <g transform="translate(290, 28)" filter="url(#sh)">
                    <rect
                      x="38"
                      y="38"
                      width="7"
                      height="26"
                      rx="3.5"
                      transform="rotate(-45 38 38)"
                      fill="url(#sg)"
                    />
                    <circle
                      cx="22"
                      cy="22"
                      r="20"
                      fill="rgba(255,255,255,0.95)"
                      stroke="url(#eg)"
                      stroke-width="4"
                    />
                    <circle
                      cx="22"
                      cy="22"
                      r="15"
                      fill="rgba(16,185,129,0.06)"
                    />
                    <path
                      d="M 11 16 A 10 10 0 0 1 24 9"
                      fill="none"
                      stroke="rgba(255,255,255,0.7)"
                      stroke-width="2"
                      stroke-linecap="round"
                    />
                    <text
                      x="22"
                      y="29"
                      font-family="Montserrat"
                      font-size="20"
                      font-weight="900"
                      fill="url(#eg)"
                      text-anchor="middle"
                    >
                      ?
                    </text>
                  </g>

                  <!-- Coins -->
                  <g transform="translate(55, 168)" filter="url(#sh)">
                    <circle cx="14" cy="14" r="14" fill="url(#gg)" />
                    <circle
                      cx="14"
                      cy="14"
                      r="10"
                      fill="none"
                      stroke="rgba(255,255,255,0.5)"
                      stroke-width="1"
                    />
                    <text
                      x="14"
                      y="19"
                      font-family="Montserrat"
                      font-size="13"
                      font-weight="700"
                      fill="#fff"
                      text-anchor="middle"
                    >
                      ₹
                    </text>
                  </g>
                  <g transform="translate(330, 185)" filter="url(#sh)">
                    <circle cx="11" cy="11" r="11" fill="url(#gg)" />
                    <text
                      x="11"
                      y="15.5"
                      font-family="Montserrat"
                      font-size="11"
                      font-weight="700"
                      fill="#fff"
                      text-anchor="middle"
                    >
                      ₹
                    </text>
                  </g>
                  <g
                    transform="translate(155, 195) rotate(12)"
                    filter="url(#sh)"
                  >
                    <ellipse cx="12" cy="8" rx="12" ry="8" fill="url(#gg)" />
                    <text
                      x="12"
                      y="12"
                      font-family="Montserrat"
                      font-size="9"
                      font-weight="700"
                      fill="#fff"
                      text-anchor="middle"
                    >
                      ₹
                    </text>
                  </g>

                  <!-- X mark at break point -->
                  <g transform="translate(305, 168)" opacity="0.9">
                    <circle
                      cx="10"
                      cy="10"
                      r="10"
                      fill="rgba(239,68,68,0.12)"
                    />
                    <line
                      x1="6"
                      y1="6"
                      x2="14"
                      y2="14"
                      stroke="#ef4444"
                      stroke-width="2"
                      stroke-linecap="round"
                    />
                    <line
                      x1="14"
                      y1="6"
                      x2="6"
                      y2="14"
                      stroke="#ef4444"
                      stroke-width="2"
                      stroke-linecap="round"
                    />
                  </g>
                </svg>
              </div>

              <!-- Status badge -->
              <div class="anim-up">
                <span class="status-badge">
                  <span class="dot"></span> Page Not Found
                </span>
              </div>

              <!-- 404 number -->
              <div class="error-title anim-up">404</div>

              <!-- Subtitle -->
              <div class="error-subtitle anim-up">
                Budget Unbalanced &amp; <span>Page Off-Grid</span>
              </div>

              <!-- Description -->
              <p class="error-desc anim-up">
                The asset or path you requested has been moved, frozen, or
                liquidated. Let's redirect your resources and get your financial
                journey back on track.
              </p>

              <!-- Buttons -->
              <div
                class="error-buttons d-flex flex-wrap justify-content-center gap-3 anim-up"
              >
                <button onclick="history.back()" class="btn btn-outline-slate">
                  <i class="fa-solid fa-arrow-left-long"></i> Go Back
                </button>
                <a href="../index.html" class="btn btn-emerald text-white">
                  <i class="fa-solid fa-house"></i> Return Home
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Bootstrap 5.3 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/script.js"></script>
  </body>
</html>
